theme: jekyll-theme-chirpy

lang: ko
timezone: Asia/Seoul

title: hello taeng
tagline: taeng.kim
description: taeng.kim personal blog

url: "https://taengkim.github.io"
baseurl: ""

# 글 URL을 Chirpy 표준(/posts/제목/)으로 고정. 없으면 Jekyll 기본값(/카테고리/연/월/일/제목.html)이 되어
# 한글 카테고리가 URL 인코딩되고 /posts/ 경로가 404가 난다.
permalink: /posts/:title/

github:
  username: taengkim

social:
  name: taeng.kim
  email: taeng.kim@kakao.com
  links:
    - https://github.com/taengkim

avatar: ""
toc: true

paginate: 30

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
  - scope:
      path: _tabs
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-archives
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-include-cache
